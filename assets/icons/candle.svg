  <ellipse cx="32" cy="30" rx="10" ry="16" fill="gold" opacity="0.3"/>
  <!-- Candle Flame Main -->
  <ellipse cx="32" cy="36" rx="6" ry="12" fill="gold" opacity="0.8"/>
