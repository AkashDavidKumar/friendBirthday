  <ellipse cx="32" cy="52" rx="8" ry="3" fill="#f7e7b7" opacity="0.8"/>
  <!-- Candle Wick -->
  <rect x="30.5" y="36" width="3" height="12" rx="1.5" fill="#333"/>
