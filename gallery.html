<!DOCTYPE html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Gallery 🎂📸</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
  background: radial-gradient(#ffdde1, #ee9ca7);
}

#gallery {
  text-align: center;
  transition: opacity 1s ease-in-out;
}

#gallery h2 {
  font-size: 2.5rem;
  margin: 32px 0;
  color: #ff4081;
}

.photo-container {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 20;
  background: transparent;
  padding: 20px; /* ✅ spacing from screen edges */
}

/* ✅ Let each image keep its original aspect ratio */
img {
  width: 100%;
  height: auto;
  max-width: 400px;
  border-radius: 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18), 0 1.5px 6px rgba(0,0,0,0.15);
  animation: shakeDown 1s ease-in-out;
  background: transparent;
  display: block;
  transition: transform 0.3s ease;
  transform: translateY(0);
  will-change: transform;
  cursor: pointer;
  object-fit: contain; /* ✅ show the full image (no crop/stretch) */
}

@keyframes shakeDown {
  0% { transform: translateY(-100%) rotate(0deg); opacity: 0; }
  30% { transform: translateY(0) rotate(2deg); opacity: 1; }
  60% { transform: translateY(-5px) rotate(-2deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

.fade-in { animation: fadeInImg 0.7s; }
@keyframes fadeInImg { from { opacity: 0; } to { opacity: 1; } }

.slide-in { animation: slideInImg 0.7s; }
@keyframes slideInImg { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }

.zoom-in { animation: zoomInImg 0.7s; }
@keyframes zoomInImg { from { transform: scale(1.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.song-btn {
  display: inline-block;
  margin: 24px auto 0 auto;
  padding: 14px 38px;
  font-size: 1.2rem;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(90deg, #ff4081 40%, #ffd700 100%);
  border: none;
  border-radius: 32px;
  box-shadow: 0 4px 16px #ff408155;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s, box-shadow 0.2s, opacity 0.5s;
  outline: none;
  z-index: 100;
}

.song-btn:hover, .song-btn:focus {
  background: linear-gradient(90deg, #ffd700 20%, #ff4081 100%);
  transform: scale(1.05);
  box-shadow: 0 8px 24px #ffd70055;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}

.button-container {
  text-align: center;
}

@media (max-width: 600px) {
  #gallery h2 {
    font-size: 1.3rem;
    margin: 18px 0;
  }

  .photo-container {
    padding: 12px; /* ✅ smaller padding for mobile */
  }

  img {
    max-width: 95vw;
    height: auto;
  }

  .song-btn {
    font-size: 1rem;
    padding: 12px 28px;
  }
}
  </style>
</head>
<body>
  <div id="gallery">
    <h2>Birthday Baby's Gallery 🎂📸</h2>
    <div class="photo-container">
      <img src="./assets/images/image1.jpeg" id="photo" alt="Birthday Photo" />
    </div>
  </div>

  <div class="button-container">
    <button id="playFavoriteBtn" class="song-btn hidden">▶ Play a Favorite Song</button>
  </div>

  <audio id="birthdaySong" autoplay loop>
    <source src="./assets/music/birthday.mp3" type="audio/mp3">
  </audio>

  <audio id="favoriteSong">
    <source src="./assets/music/favorite.mp3" type="audio/mpeg">
  </audio>

  <script type="module">
    document.addEventListener('DOMContentLoaded', function () {
      const photoEl = document.getElementById('photo');
      const birthdaySong = document.getElementById('birthdaySong');
      const favoriteSong = document.getElementById('favoriteSong');
      const playFavoriteBtn = document.getElementById('playFavoriteBtn');

      const photos = [
        './assets/images/image2.jpeg',
        './assets/images/image3.jpeg',
        './assets/images/image4.jpeg',
        './assets/images/image5.jpeg',
        './assets/images/image6.jpeg',
        './assets/images/image7.jpeg',
        './assets/images/image8.jpeg',
        './assets/images/image9.jpeg'
      ];

      let photoIndex = 0;

      function changePhoto() {
        photoIndex++;
        if (photoIndex < photos.length) {
          const anims = ['fade-in', 'slide-in', 'zoom-in', 'shakeDown'];
          const anim = anims[photoIndex % anims.length];

          // ✅ Load image *first* to prevent flicker/delay
          const newImg = new Image();
          newImg.src = photos[photoIndex];
          newImg.onload = () => {
            photoEl.classList.remove(...anims);
            photoEl.src = newImg.src;
            void photoEl.offsetWidth; // Force reflow
            photoEl.classList.add(anim);
          };
        } else {
          clearInterval(interval);
          playFavoriteBtn.classList.remove('hidden');
        }
      }

      // ✅ Change photo every 4s
      const interval = setInterval(changePhoto, 4000);

      playFavoriteBtn.addEventListener('click', () => {
        if (favoriteSong.paused) {
          birthdaySong.pause();
          favoriteSong.play();
          playFavoriteBtn.textContent = '⏹ Stop the Song';
        } else {
          favoriteSong.pause();
          favoriteSong.currentTime = 0;
          birthdaySong.play();
          playFavoriteBtn.textContent = '▶ Play a Favorite Song';
        }
      });

      favoriteSong.addEventListener('ended', () => {
        birthdaySong.play();
        playFavoriteBtn.textContent = '▶ Play a Favorite Song';
      });
    });
  </script>
</body>
</html>
